# Coturn Configuration for Linkora
listening-port=3478
tls-listening-port=5349

# Ephemeral Time-Limited Credentials (REST API)
use-auth-secret
static-auth-secret=linkora-production-secret-change-me
realm=linkora.local

# Relay UDP port range
min-port=49152
max-port=65535

fingerprint
lt-cred-mech
no-cli
no-tcp-relay
verbose
